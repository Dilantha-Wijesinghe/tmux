# ─────────────────────────────────────────────
#  tmux.conf — clean & minimal
# ─────────────────────────────────────────────

# ── General ───────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 10000
set -g mouse on
set -s escape-time 0           # no delay for escape key
set -g focus-events on
set -g base-index 1            # start windows at 1
set -g pane-base-index 1       # start panes at 1
set -g renumber-windows on     # keep window numbers tidy
set -g set-clipboard on
setw -g mode-keys vi

# ── Prefix ────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Reload config ─────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded"

# ── Windows ───────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind & kill-window

# ── Splits ────────────────────────────────────
unbind '"'
unbind %
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Pane resizing ─────────────────────────────
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── Copy mode (vi) ────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# ── Status bar ────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# colors
set -g status-style                "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style           "fg=#313244,bg=default"
set -g pane-active-border-style    "fg=#89b4fa,bg=default"
set -g message-style               "bg=#1e1e2e,fg=#cdd6f4"
set -g message-command-style       "bg=#1e1e2e,fg=#cdd6f4"
set -g mode-style                  "bg=#89b4fa,fg=#1e1e2e"

# window tabs
setw -g window-status-style          "bg=#1e1e2e,fg=#6c7086"
setw -g window-status-current-style  "bg=#1e1e2e,fg=#cdd6f4,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "

# left: session name
set -g status-left  "#[fg=#89b4fa,bold] #S #[fg=#313244] "

# right: host · date · time
set -g status-right "#[fg=#6c7086]#H  #[fg=#6c7086]%d %b  #[fg=#cdd6f4]%H:%M "

# ── Plugins (TPM) ─────────────────────────────
#
#  Install TPM first:
#  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  Then press <prefix> + I inside tmux to install plugins.
#
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'    # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'         # system clipboard copy
set -g @plugin 'christoomey/vim-tmux-navigator' # seamless vim/tmux splits

# ── Plugin options ────────────────────────────
set -g @continuum-restore 'on'      # auto-restore last session on start
set -g @resurrect-capture-pane-contents 'on'

# ── Initialize TPM (keep at very bottom) ──────
run '~/.tmux/plugins/tpm/tpm'
